[package]
name = "joyce-restobar-ledger"
version = "1.0.3"
description = "Offline ledger for Joyce Restobar"
authors = ["Joyce Restobar"]
edition = "2021"

[lib]
name = "joyce_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
thiserror = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
